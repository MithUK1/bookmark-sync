<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bookmarks Sync Plus - already saved</title>
  <link rel="stylesheet" href="dupe.css">
</head>
<body>
  <div class="accent"></div>
  <main>
    <h1>You already have this bookmark</h1>
    <p id="added" class="muted"></p>
    <p>Already saved in:</p>
    <ul id="existing"></ul>
    <div class="actions">
      <button id="keep" class="primary" type="button">Keep both</button>
      <button id="remove" type="button">Remove the new one</button>
    </div>
  </main>
  <script src="dupe.js"></script>
</body>
</html>
